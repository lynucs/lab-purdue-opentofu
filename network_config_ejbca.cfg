      - 192.168.10.100/24
    routes:
      - to: default
        via: 192.168.10.1
      - to: 192.168.20.0/24
        via: 192.168.10.254
      - to: 192.168.30.0/24
        via: 192.168.10.254
    nameservers:
      addresses:
        - 192.168.10.1
      search:
        - it.local
        - idmz.local
        - ot.local
        - ~.