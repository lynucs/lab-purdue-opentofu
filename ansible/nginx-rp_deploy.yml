---
- name: Nginx reverse proxy + ModSecurity
  hosts: webrelay
  become: true
  gather_facts: true

  tasks:
    # -------------------------------------------------------------------------
    # Installation des packages
    # -------------------------------------------------------------------------
    - name: Installer les plugins DNF fournissant config-manager
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Lire les dépôts activés
      ansible.builtin.command:
        argv:
          - dnf
          - repolist
          - --enabled
      register: enabled_repositories
      changed_when: false

    - name: Activer le dépôt CRB (CodeReady Builder)
      ansible.builtin.command:
        argv:
          - dnf
          - config-manager
          - --set-enabled
          - crb
      when: "'crb' not in enabled_repositories.stdout"

    - name: Installer EPEL
      ansible.builtin.dnf:
        name:
          - epel-release
        state: present

    - name: Paquets Nginx + ModSecurity
      ansible.builtin.dnf:
        name: "{{ rp_packages }}"
        state: present
        update_cache: true

    - name: Vérifier les composants réellement installés
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - nginx
          - nginx-core
          - nginx-filesystem
          - nginx-mod-modsecurity
          - libmodsecurity
      register: installed_waf_packages
      changed_when: false

    - name: Afficher le socle WAF installé
      ansible.builtin.debug:
        var: installed_waf_packages.stdout_lines

    # -------------------------------------------------------------------------
    # Configuration ModSecurity + OWASP CRS
    # -------------------------------------------------------------------------
    - name: Créer /etc/nginx/modsec
      ansible.builtin.file:
        path: /etc/nginx/modsec
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Déployer modsecurity.conf depuis files/modsec
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/files/modsec/modsecurity.conf"
        dest: /etc/nginx/modsec/modsecurity.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Déployer unicode.mapping depuis files/modsec
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/files/modsec/unicode.mapping"
        dest: /etc/nginx/modsec/unicode.mapping
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Créer le répertoire cible /etc/nginx/modsec/owasp-crs
      ansible.builtin.file:
        path: /etc/nginx/modsec/owasp-crs
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extraire OWASP CRS depuis l'archive locale
      ansible.builtin.unarchive:
        src: "{{ inventory_dir }}/repositories/coreruleset-{{ crs_version }}.tar.gz"
        dest: /etc/nginx/modsec/owasp-crs
        owner: root
        group: root
        extra_opts:
          - "--strip-components=1"
        creates: /etc/nginx/modsec/owasp-crs/crs-setup.conf.example
      notify: Reload nginx

    - name: Initialiser crs-setup.conf
      ansible.builtin.copy:
        src: /etc/nginx/modsec/owasp-crs/crs-setup.conf.example
        dest: /etc/nginx/modsec/owasp-crs/crs-setup.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: false
      notify: Reload nginx

    - name: Déployer main.conf
      ansible.builtin.copy:
        dest: /etc/nginx/modsec/main.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Include /etc/nginx/modsec/modsecurity.conf
          Include /etc/nginx/modsec/owasp-crs/crs-setup.conf
          Include /etc/nginx/modsec/owasp-crs/rules/*.conf
      notify: Reload nginx

    - name: Créer le journal d'audit ModSecurity
      ansible.builtin.file:
        path: "{{ modsec_audit_log }}"
        state: touch
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
        mode: "0640"
        modification_time: preserve
        access_time: preserve
      notify: Reload nginx

    # -------------------------------------------------------------------------
    # Certificat TLS Nginx
    # -------------------------------------------------------------------------
    - name: Générer le certificat serveur Nginx
      ansible.builtin.command: >
        openssl req -x509 -nodes -newkey rsa:2048 -days 825
        -keyout /etc/nginx/nginx.key
        -out /etc/nginx/nginx.crt
        -subj "/CN=rp.idmz.local"
      args:
        creates: /etc/nginx/nginx.crt

    - name: Appliquer les droits sur les certificats
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ nginx_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/nginx/nginx.key, mode: "0640" }
        - { path: /etc/nginx/nginx.crt, mode: "0644" }

    # -------------------------------------------------------------------------
    # Configuration Nginx
    # -------------------------------------------------------------------------
    - name: Retirer default.conf
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Déployer le vhost reverse proxy
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/reverse_proxy.conf.j2"
        dest: /etc/nginx/conf.d/reverse_proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Valider la configuration Nginx
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Démarrer et activer Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Appliquer les handlers en attente
      ansible.builtin.meta: flush_handlers

    - name: Vérifier l'écoute HTTPS
      ansible.builtin.wait_for:
        host: "{{ waf_listen_ip }}"
        port: "{{ nginx_https_port }}"
        timeout: 20

    # -------------------------------------------------------------------------
    # Intégration Wazuh
    # -------------------------------------------------------------------------
    - name: Vérifier la présence de ossec.conf
      ansible.builtin.stat:
        path: "{{ wazuh_ossec_conf }}"
      register: wazuh_conf

    - name: Vérifier l'existence de l'utilisateur Wazuh
      ansible.builtin.getent:
        database: passwd
        key: wazuh
      register: wazuh_user
      failed_when: false
      when: wazuh_conf.stat.exists

    - name: Autoriser Wazuh à parcourir /var/log/nginx
      ansible.posix.acl:
        path: /var/log/nginx
        entity: wazuh
        etype: user
        permissions: rx
        state: present
      when:
        - wazuh_conf.stat.exists
        - "'wazuh' in (wazuh_user.ansible_facts.getent_passwd | default({}))"

    - name: Définir l'ACL par défaut Wazuh sur /var/log/nginx
      ansible.posix.acl:
        path: /var/log/nginx
        entity: wazuh
        etype: user
        permissions: rX
        default: true
        state: present
      when:
        - wazuh_conf.stat.exists
        - "'wazuh' in (wazuh_user.ansible_facts.getent_passwd | default({}))"

    - name: Appliquer l'ACL de lecture sur modsec_audit.log pour Wazuh
      ansible.posix.acl:
        path: "{{ modsec_audit_log }}"
        entity: wazuh
        etype: user
        permissions: r
        state: present
      when:
        - wazuh_conf.stat.exists
        - "'wazuh' in (wazuh_user.ansible_facts.getent_passwd | default({}))"

    - name: Configurer la collecte JSON ModSecurity dans Wazuh
      ansible.builtin.blockinfile:
        path: "{{ wazuh_ossec_conf }}"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK : MODSECURITY WAF -->"
        insertbefore: "</ossec_config>"
        block: |
          <localfile>
            <log_format>json</log_format>
            <location>{{ modsec_audit_log }}</location>
          </localfile>
      when: wazuh_conf.stat.exists
      notify: Restart wazuh-agent

    - name: Configurer le FIM Nginx / ModSecurity dans Wazuh
      ansible.builtin.blockinfile:
        path: "{{ wazuh_ossec_conf }}"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK : NGINX FIM -->"
        insertbefore: "</ossec_config>"
        block: |
          <syscheck>
            <directories check_all="yes" realtime="yes">/etc/nginx/conf.d</directories>
            <directories check_all="yes" realtime="yes">/etc/nginx/modsec</directories>
          </syscheck>
      when: wazuh_conf.stat.exists
      notify: Restart wazuh-agent

  handlers:
    - name: Validate nginx
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Restart wazuh-agent
      ansible.builtin.service:
        name: wazuh-agent
        state: restarted