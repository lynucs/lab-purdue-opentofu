---
- name: Nginx reverse proxy + ModSecurity
  hosts: squid
  become: true
  gather_facts: true

  vars:
    nginx_version: "1.20.1"
    nginx_modsecurity_version: "1.0.4-18.el9"
    crs_version: "v4.14.0"
    modsecurity_version: "v3.0.17"

    rp_packages:
      - "nginx-{{ nginx_version }}"
      - "nginx-mod-modsecurity-{{ nginx_modsecurity_version }}"
      - acl
      - git
      
    waf_listen_ip: "192.168.20.20"
    nginx_https_port: 8443
    
    wazuh_ossec_conf: /var/ossec/etc/ossec.conf
    modsec_audit_log: /var/log/nginx/modsec_audit.log

    nginx_user: "nginx"


  tasks:
    # -------------------------------------------------------------------------
    # Installation des packages
    # -------------------------------------------------------------------------
    - name: Installer les plugins DNF (Dandified YUM) fournissant config-manager
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Lire les dépôts activés
      ansible.builtin.command:
        argv:
          - dnf
          - repolist
          - --enabled
      register: enabled_repositories
      changed_when: false

    - name: Activer le dépôt CRB (CodeReady Builder)
      ansible.builtin.command:
        argv:
          - dnf
          - config-manager
          - --set-enabled
          - crb
      when: "'crb' not in enabled_repositories.stdout"

    - name: Installer EPEL (Extra Packages for Enterprise Linux)
      ansible.builtin.dnf:
        name:
          - epel-release
        state: present

    - name: Paquets Nginx + ModSecurity
      ansible.builtin.dnf:
        name: "{{ rp_packages }}"
        state: present
        update_cache: true
#        allow_downgrade: true  # A activer au besoin. Si une version supérieure est déjà installée, la tâche peut échouer ou ne pas revenir à la version souhaitée.


    - name: Vérifier les composants réellement installés
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - nginx
          - nginx-core
          - nginx-filesystem
          - nginx-mod-modsecurity
          - libmodsecurity
      register: installed_waf_packages
      changed_when: false

    - name: Afficher le socle WAF installé
      ansible.builtin.debug:
        var: installed_waf_packages.stdout_lines

    # -------------------------------------------------------------------------
    # Conf modsec
    # -------------------------------------------------------------------------
    - name: /etc/nginx/modsec
      ansible.builtin.file:
        path: /etc/nginx/modsec
        state: directory
        mode: "0755"

    - name: Télécharger la configuration ModSecurity
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/{{ modsecurity_version }}/modsecurity.conf-recommended
        dest: /etc/nginx/modsec/modsecurity.conf
        owner: root
        group: root
        mode: "0644"
        force: true
      notify: Reload nginx

    - name: Configurer les options ModSecurity (Blocage + Audit JSON)
      ansible.builtin.lineinfile:
        path: /etc/nginx/modsec/modsecurity.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?SecRuleEngine\b', line: 'SecRuleEngine On' }
        - { regexp: '^#?SecAuditEngine\b', line: 'SecAuditEngine RelevantOnly' }
        - { regexp: '^#?SecAuditLogRelevantStatus\b', line: 'SecAuditLogRelevantStatus "^(?:5|4(?!04))"' }
        - { regexp: '^#?SecAuditLogFormat\b', line: 'SecAuditLogFormat JSON' }
        - { regexp: '^#?SecAuditLogType\b', line: 'SecAuditLogType Serial' }
        - { regexp: '^#?SecAuditLog\s+', line: 'SecAuditLog {{ modsec_audit_log }}' }
      notify: Reload nginx

    - name: Télécharger unicode.mapping
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/owasp-modsecurity/ModSecurity/{{ modsecurity_version }}/unicode.mapping
        dest: /etc/nginx/modsec/unicode.mapping
        owner: root
        group: root
        mode: "0644"
        force: true
      notify: Reload nginx

    - name: Installer OWASP CRS
      ansible.builtin.git:
        repo: https://github.com/coreruleset/coreruleset.git
        dest: /etc/nginx/modsec/owasp-crs
        version: "{{ crs_version }}"
        update: true
        force: false
      notify: Reload nginx

    - name: Initialiser crs-setup.conf
      ansible.builtin.copy:
        src: /etc/nginx/modsec/owasp-crs/crs-setup.conf.example
        dest: /etc/nginx/modsec/owasp-crs/crs-setup.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: false
      notify: Reload nginx

    - name: main.conf
      ansible.builtin.copy:
        dest: /etc/nginx/modsec/main.conf
        mode: "0644"
        content: |
          Include /etc/nginx/modsec/modsecurity.conf
          Include /etc/nginx/modsec/owasp-crs/crs-setup.conf
          Include /etc/nginx/modsec/owasp-crs/rules/*.conf
      notify: Reload nginx

    - name: Journal audit
      ansible.builtin.file:
        path: "{{ modsec_audit_log }}"
        state: touch
        owner: "{{ nginx_user }}"
        group: "{{ nginx_user }}"
        mode: "0640"
        modification_time: preserve
        access_time: preserve
      notify: Reload nginx

    # -------------------------------------------------------------------------
    # Cert nginx
    # -------------------------------------------------------------------------
    - name: Certificat serveur Nginx
      ansible.builtin.command: >
        openssl req -x509 -nodes -newkey rsa:2048 -days 825
        -keyout /etc/nginx/nginx.key
        -out /etc/nginx/nginx.crt
        -subj "/CN=rp.idmz.local"
      args:
        creates: /etc/nginx/nginx.crt
      # Remarque: manque le SAN, mais cela sera remplacé par un certificat EJBCA

    - name: Droits certs
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ nginx_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/nginx/nginx.key, mode: "0640" }
        - { path: /etc/nginx/nginx.crt, mode: "0644" }

   # -------------------------------------------------------------------------
    # Conf nginx
    # -------------------------------------------------------------------------
    - name: Retirer default.conf
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Déployer le vhost reverse proxy
      ansible.builtin.template:
        src: "{{ inventory_dir }}/templates/reverse_proxy.conf.j2"
        dest: /etc/nginx/conf.d/reverse_proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Valider la configuration Nginx
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Démarrer et activer Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Appliquer les handlers en attente
      ansible.builtin.meta: flush_handlers

    - name: Vérifier l’écoute HTTPS
      ansible.builtin.wait_for:
        host: "{{ waf_listen_ip }}"
        port: "{{ nginx_https_port }}"
        timeout: 20
    # -------------------------------------------------------------------------
    # Wazuh
    # -------------------------------------------------------------------------

    - name: Wazuh agent présent ?
      ansible.builtin.stat:
        path: "{{ wazuh_ossec_conf }}"
      register: wazuh_conf

    - name: Vérifier l’existence de l’utilisateur Wazuh
      ansible.builtin.getent:
        database: passwd
        key: wazuh
      register: wazuh_user
      failed_when: false
      when: wazuh_conf.stat.exists
          
    - name: Autoriser Wazuh à parcourir le répertoire des journaux Nginx
      ansible.posix.acl:
        path: /var/log/nginx
        entity: wazuh
        etype: user
        permissions: rx
        state: present
      when:
        - wazuh_conf.stat.exists
        - "'wazuh' in (wazuh_user.ansible_facts.getent_passwd | default({}))"

    - name: Définir l'ACL Wazuh pour les futurs journaux
      ansible.posix.acl:
        path: /var/log/nginx
        entity: wazuh
        etype: user
        permissions: rX
        default: true
        state: present
      when:
        - wazuh_conf.stat.exists
        - "'wazuh' in (wazuh_user.ansible_facts.getent_passwd | default({}))"

    - name: Collecte log ModSecurity JSON
      ansible.builtin.blockinfile:
        path: "{{ wazuh_ossec_conf }}"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK : MODSECURITY WAF -->"
        insertbefore: "</ossec_config>"
        block: |
          <localfile>
            <log_format>json</log_format>
            <location>{{ modsec_audit_log }}</location>
          </localfile>
      when: wazuh_conf.stat.exists
      notify: Restart wazuh-agent

    - name: FIM Nginx / ModSecurity
      ansible.builtin.blockinfile:
        path: "{{ wazuh_ossec_conf }}"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK : NGINX FIM -->"
        insertbefore: "</ossec_config>"
        block: |
          <syscheck>
            <directories check_all="yes" realtime="yes">/etc/nginx/conf.d</directories>
            <directories check_all="yes" realtime="yes">/etc/nginx/modsec</directories>
          </syscheck>
      when: wazuh_conf.stat.exists
      notify: Restart wazuh-agent

  handlers:
    - name: Validate nginx
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false
      listen: Reload nginx

    - name: Reload nginx service
      ansible.builtin.service:
        name: nginx
        state: reloaded
      listen: Reload nginx

    - name: Restart wazuh-agent
      ansible.builtin.service:
        name: wazuh-agent
        state: restarted