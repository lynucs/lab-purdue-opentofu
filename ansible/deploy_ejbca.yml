---
- name: Installer Docker et déployer EJBCA Community Edition
  hosts: ejbca
  become: true
  tasks:
    - name: Mettre a jour le cache apt et installer les prerequis
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Creer le repertoire pour le porte-cles apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la cle GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configurer le depot Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present

    - name: Installer Docker Engine et Docker Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ajouter l'utilisateur ubuntu au groupe docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Creer le dossier de deploiement ejbca
      ansible.builtin.file:
        path: /opt/ejbca
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Deposer le docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/ejbca/docker-compose.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        content: |
          services:
            ejbca:
              image: keyfactor/ejbca-ce:latest
              container_name: ejbca
              hostname: ejbca.it.local
              restart: unless-stopped
              ports:
                - "80:8080"
                - "443:8443"
              environment:
                - LOG_LEVEL_APP=INFO
              volumes:
                - ejbca_data:/opt/primekey/ejbca/custom/
          volumes:
            ejbca_data:

    - name: Demarrer le conteneur EJBCA
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/ejbca
        