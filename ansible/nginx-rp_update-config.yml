---
- name: Mettre à jour la configuration Nginx Reverse Proxy et ModSecurity
  hosts: webrelay
  become: true
  gather_facts: false

  vars:
    nginx_template: "{{ inventory_dir }}/templates/reverse_proxy.conf.j2"
    nginx_config: /etc/nginx/conf.d/reverse_proxy.conf
    modsec_files:
      - src: "{{ inventory_dir }}/files/modsec/modsecurity.conf"
        dest: /etc/nginx/modsec/modsecurity.conf
      - src: "{{ inventory_dir }}/files/modsec/unicode.mapping"
        dest: /etc/nginx/modsec/unicode.mapping

  tasks:
    - name: Vérifier que le template Nginx existe sur le contrôleur
      ansible.builtin.stat:
        path: "{{ nginx_template }}"
      delegate_to: localhost
      become: false
      register: nginx_template_file

    - name: Vérifier que les fichiers ModSecurity existent sur le contrôleur
      ansible.builtin.stat:
        path: "{{ item.src }}"
      delegate_to: localhost
      become: false
      loop: "{{ modsec_files }}"
      register: modsec_source_files

    - name: Refuser le déploiement si un fichier source est absent
      ansible.builtin.assert:
        that:
          - nginx_template_file.stat.exists
          - modsec_source_files.results | map(attribute='stat.exists') is all
        fail_msg: "Le template Nginx ou un fichier dans files/modsec/ est absent sur le contrôleur."

    - name: Vérifier si reverse_proxy.conf diffère de la cible
      ansible.builtin.template:
        src: "{{ nginx_template }}"
        dest: "{{ nginx_config }}"
        owner: root
        group: root
        mode: "0644"
      check_mode: true
      register: nginx_config_diff

    - name: Vérifier si les fichiers ModSecurity diffèrent de la cible
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ modsec_files }}"
      check_mode: true
      register: modsec_files_diff

    - name: Stopper l'exécution si aucune modification n'est requise
      ansible.builtin.meta: end_host
      when:
        - not nginx_config_diff.changed
        - not modsec_files_diff.changed

    - name: Appliquer reverse_proxy.conf
      ansible.builtin.template:
        src: "{{ nginx_template }}"
        dest: "{{ nginx_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Valider et recharger Nginx

    - name: Appliquer les fichiers ModSecurity
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ modsec_files }}"
      notify: Valider et recharger Nginx

    - name: Exécuter immédiatement le handler Nginx
      ansible.builtin.meta: flush_handlers

    - name: Vérifier que Nginx est actif
      ansible.builtin.systemd:
        name: nginx
        state: started
      check_mode: true
      register: nginx_service_status
      failed_when: nginx_service_status.changed

  handlers:
    - name: Valider la configuration Nginx
      ansible.builtin.command:
        argv:
          - /usr/sbin/nginx
          - -t
      changed_when: false
      listen: Valider et recharger Nginx

    - name: Recharger le service Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      listen: Valider et recharger Nginx