---
# Paramètres réseau & Reverse Proxy WAF (Nginx + ModSecurity)
waf_listen_ip: "192.168.20.20"
nginx_https_port: 8443
waf_allowed_nets:
  - "192.168.10.0/24"

modsec_audit_log: /var/log/nginx/modsec_audit.log
nginx_user: "nginx"

nginx_version: "1.20.1"
nginx_modsecurity_version: "1.0.4-18.el9"
crs_version: "4.14.0"

rp_packages:
  - "nginx-{{ nginx_version }}"
  - "nginx-mod-modsecurity-{{ nginx_modsecurity_version }}"
  - acl

# Paramètres Proxy HTTP/HTTPS (Squid SSL-Bump)
squid_port: 3128
squid_allowed_nets:
  - 192.168.20.0/24
  - 192.168.30.0/24

squid_user: squid
squid_group: squid

squid_ssl_dir: /etc/squid/ssl
squid_ssl_db_path: /var/spool/squid/ssl_db

squid_ssl_db_size_mb: 20
squid_dynamic_cert_mem_cache_size: 16MB
squid_cache_size_mb: 100

squid_security_file_certgen_bin: /usr/lib64/squid/security_file_certgen

squid_packages:
  - squid
  - openssl
  - ca-certificates
  - acl

# Paramètres SIEM Wazuh
wazuh_user: wazuh
wazuh_ossec_conf: /var/ossec/etc/ossec.conf
