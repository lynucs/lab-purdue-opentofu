---
- name: Nginx hello world (Podman) sur vm-ot
  hosts: vm-ot
  become: true

  tasks:
    - name: Installer Podman
      ansible.builtin.apt:
        name: podman
        state: present
        update_cache: true

    - name: Docroot
      ansible.builtin.file:
        path: /srv/www
        state: directory
        mode: "0755"

    - name: index.html
      ansible.builtin.copy:
        dest: /srv/www/index.html
        content: "hello world\n"
        mode: "0644"

    - name: Conteneur nginx
      ansible.builtin.command: >
        podman run -d --name www --replace
        --restart=always
        -p 80:80
        -v /srv/www:/usr/share/nginx/html:ro
        docker.io/library/nginx:alpine
      register: podman_run
      changed_when: podman_run.rc == 0
      failed_when: podman_run.rc != 0 and 'already exists' not in (podman_run.stderr | default(''))