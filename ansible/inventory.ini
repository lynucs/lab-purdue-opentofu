# --- Serveurs Ubuntu ---
[it_servers]
vm-it   ansible_host=192.168.10.10  ansible_user=ubuntu
ejbca   ansible_host=192.168.10.100 ansible_user=ubuntu

[idmz_servers]
vm-idmz ansible_host=192.168.20.10  ansible_user=ubuntu

[ot_servers]
vm-ot   ansible_host=192.168.30.10  ansible_user=ubuntu

# --- Sonde IDS (Rocky Linux 9) ---
[ids]
suricata ansible_host=192.168.30.50 ansible_user=rocky

[wazuh_managers]
wazuh-manager ansible_host=192.168.30.100 ansible_user=rocky

# --- Firewalls Alpine Linux ---
[firewalls]
fw1     ansible_host=192.168.10.254 ansible_user=alpine ansible_shell_type=sh
fw2     ansible_host=192.168.20.254 ansible_user=alpine ansible_shell_type=sh

# --- Groupes agrégés ---
[ubuntu:children]
it_servers
idmz_servers
ot_servers

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_ed25519