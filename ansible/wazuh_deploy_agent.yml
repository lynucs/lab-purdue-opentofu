---
- name: Installer et enrôler un agent Wazuh 4.9.0
  hosts: "{{ target_hosts }}"
  become: true
  vars:
    wazuh_manager_ip: "192.168.30.100"
    wazuh_agent_name: "{{ inventory_hostname }}"
    wazuh_agent_group: "default,ot-network"

  tasks:
    - name: Importer la clé GPG officielle Wazuh
      ansible.builtin.rpm_key:
        key: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        state: present

    - name: Ajouter le dépôt RPM officiel Wazuh v4.x
      ansible.builtin.yum_repository:
        name: wazuh
        description: Dépôt officiel Wazuh
        baseurl: https://packages.wazuh.com/4.x/yum/
        gpgcheck: true
        gpgkey: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        enabled: true

    - name: Installer le paquet wazuh-agent 4.9.0 avec variables d'enrôlement
      ansible.builtin.dnf:
        name: "wazuh-agent-4.9.0"
        state: present
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
        WAZUH_AGENT_NAME: "{{ wazuh_agent_name }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"

    - name: Configurer l'adresse du Manager dans ossec.conf
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        replace: '<address>{{ wazuh_manager_ip }}</address>'
      notify: Restart Wazuh Agent

    - name: S'assurer des paramètres d'enrôlement (nom et groupes) dans ossec.conf
      ansible.builtin.blockinfile:
        path: /var/ossec/etc/ossec.conf
        insertafter: '</server>'
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK : ENROLLMENT -->"
        block: |
          <enrollment>
            <enabled>yes</enabled>
            <manager_address>{{ wazuh_manager_ip }}</manager_address>
            <agent_name>{{ wazuh_agent_name }}</agent_name>
            <groups>{{ wazuh_agent_group }}</groups>
          </enrollment>
      notify: Restart Wazuh Agent

    - name: Activer et démarrer le service wazuh-agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: started
        enabled: true

  handlers:
    - name: Restart Wazuh Agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted