#      when: ansible_os_family == "RedHat"
#      failed_when: false

    - name: Débloquer systemd
      ansible.builtin.command: systemctl reset-failed squid
      changed_when: false

    - name: Squid started
      ansible.builtin.service:
        name: squid
        state: started
        enabled: true

