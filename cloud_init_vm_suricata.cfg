#cloud-config
hostname: suricata
fqdn: suricata.ot.local
manage_etc_hosts: true

users:
  - name: rocky
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: tofu
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrQlWI/5AP1TgH+S9aftBnm1+jSuNRUnKNIKmybHPYo

ssh_pwauth: true

bootcmd:
  - systemctl mask NetworkManager-wait-online.service

runcmd:
  - |
    # Nettoyage des profils automatiques créés par NetworkManager
    for conn in $(nmcli -g NAME connection show); do
      nmcli connection delete "$conn" || true
    done

    # Configuration eth0 (Admin OT)
    nmcli connection add type ethernet con-name eth0 ifname eth0 \
      ip4 192.168.30.50/24 gw4 192.168.30.253 \
      ipv4.dns "192.168.10.1" \
      ipv4.dns-search "it.local idmz.local ot.local" \
      autoconnect yes
    nmcli connection up eth0

    # Configuration eth1 (Capture iDMZ sans IP)
    nmcli connection add type ethernet con-name eth1 ifname eth1 \
      ipv4.method disabled ipv6.method disabled \
      autoconnect yes
    nmcli connection up eth1