#cloud-config
hostname: wazuh-manager
disable_root: false

users:
  - name: rocky
    gecos: Rocky User
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, wheel
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrQlWI/5AP1TgH+S9aftBnm1+jSuNRUnKNIKmybHPYo

ssh_pwauth: true

write_files:
  - path: /etc/NetworkManager/system-connections/eth0.nmconnection
    permissions: '0600'
    content: |
      [connection]
      id=eth0
      type=ethernet
      interface-name=eth0

      [ipv4]
      method=manual
      addresses=192.168.30.100/24
      gateway=192.168.30.253
      dns=192.168.10.1;1.1.1.1;

      [ipv6]
      method=disabled

runcmd:
  - nmcli connection reload
  - nmcli connection up eth0 || true