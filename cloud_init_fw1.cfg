#cloud-config
hostname: fw1
disable_root: false

users:
  - name: alpine
    shell: /bin/sh
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrQlWI/5AP1TgH+S9aftBnm1+jSuNRUnKNIKmybHPYo

chpasswd:
  list: |
    root:tofu
    alpine:tofu
  expire: false
ssh_pwauth: true

bootcmd:
  - echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/00-forwarding.conf
  - echo "net.ipv4.conf.all.rp_filter = 0" >> /etc/sysctl.d/00-forwarding.conf
  - echo "net.ipv4.conf.default.rp_filter = 0" >> /etc/sysctl.d/00-forwarding.conf
  - echo "net.ipv4.conf.eth0.rp_filter = 0" >> /etc/sysctl.d/00-forwarding.conf
  - echo "net.ipv4.conf.eth1.rp_filter = 0" >> /etc/sysctl.d/00-forwarding.conf
  - sysctl -p /etc/sysctl.d/00-forwarding.conf

write_files:
  - path: /etc/network/interfaces
    content: |
      auto lo
      iface lo inet loopback

      auto eth0
      iface eth0 inet static
          address 192.168.10.254
          netmask 255.255.255.0
          gateway 192.168.10.1

      auto eth1
      iface eth1 inet static
          address 192.168.20.253
          netmask 255.255.255.0
          up ip route add 192.168.30.0/24 via 192.168.20.254 dev eth1
          down ip route del 192.168.30.0/24 via 192.168.20.254 dev eth1

  - path: /etc/apk/repositories
    content: |
      https://dl-cdn.alpinelinux.org/alpine/v3.24/main  
      https://dl-cdn.alpinelinux.org/alpine/v3.24/community

  - path: /etc/resolv.conf.head
    content: |
      nameserver 192.168.10.1
      nameserver 1.1.1.1

  - path: /etc/resolv.conf
    content: |
      nameserver 192.168.10.1
      nameserver 1.1.1.1

  - path: /root/setup_fw1.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      # 1. Neutralisation et arret de dhcpcd / udhcpc
      echo "nohook resolv.conf" >> /etc/dhcpcd.conf 2>/dev/null || true
      rc-service dhcpcd stop 2>/dev/null || true
      rc-update del dhcpcd boot 2>/dev/null || true
      rc-update del dhcpcd default 2>/dev/null || true
      killall -9 udhcpc 2>/dev/null || true

      # 2. Application de la configuration statique (/etc/network/interfaces)
      ip addr flush dev eth0 || true
      ip addr flush dev eth1 || true
      /etc/init.d/networking restart
      ip route add 192.168.30.0/24 via 192.168.20.254 dev eth1 2>/dev/null || true

      # 3. Installation des dependances et privilege sudo
      apk update || true
      apk add iptables sudo || true
      echo "alpine ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/alpine
      chmod 440 /etc/sudoers.d/alpine

      # 4. Activation et sauvegarde du NAT vers le reseau IT / Internet
      rc-update add iptables default || true
      iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE || true
      /etc/init.d/iptables save || true

runcmd:
  - /bin/sh /root/setup_fw1.sh