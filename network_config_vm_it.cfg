version: 2
ethernets:
  ens3:
    addresses:
      - 192.168.10.10/24
    routes:
      # Sortie générale / Internet via l'hôte KVM
      - to: default
        via: 192.168.10.1
      # Routes obligatoires vers les zones industrielles via fw1
      - to: 192.168.20.0/24
        via: 192.168.10.254
      - to: 192.168.30.0/24
        via: 192.168.10.254
    nameservers:
      addresses:
        - 192.168.10.1
      search:
        - it.local
        - idmz.local
        - ot.local
        - ~.
        